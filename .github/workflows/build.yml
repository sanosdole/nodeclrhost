# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-windows:
    # The type of runner that the job will run on
    runs-on: windows-2019
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3
      
      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          
      - name: Setup dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version:  | 
            8.0.x
            10.0.x

      - name: Show node version
        run: node --version
        
      - name: Show dotnet version
        run: dotnet --version
        
      - name: Install prebuild
        run: npm i -g prebuild
        
      - name: build & test coreclrhosting
        run: |
          cd coreclr-hosting
          npm ci --build-from-source
          prebuild -t 20.0.0 --include-regex "\.(node|a|dll|so|dylib|pdb)$"
          prebuild -t 22.0.0 --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 24.0.0 --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 26.0.0 --include-regex "\.(node|a|dll|so|dylib)$"          
          prebuild -t 40.0.0 -r electron --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 42.0.0 -r electron --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 44.0.0 -r electron --include-regex "\.(node|a|dll|so|dylib)$"
          npm run build-testapp
          npm run mocha
          cd ..
      
      - name: build electron-blazor-glue
        run: |
          cd electron-blazor-glue
          npm ci
          npm run build-js-glue:release
          cd ..

      - name: build nuget packages
        run: |
          cd NodeHostEnvironment
          dotnet pack -c Release
          cd ../ElectronHostedBlazor
          dotnet pack -c Release
  
