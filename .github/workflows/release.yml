# This is a basic workflow to help you get started with Actions

name: Release

# Controls when the workflow will run
on:
  release:
    types: [published]
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-windows:
    # The type of runner that the job will run on
    runs-on: windows-2022
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version:  | 
            8.0.x
            10.0.x

      - name: Show node version
        run: node --version
        
      - name: Show dotnet version
        run: dotnet --version
        
      - name: Install prebuild
        run: npm i -g prebuild
        
      - name: build & test coreclrhosting
        run: |
          cd coreclr-hosting
          npm version "%GITHUB_REF:~11%" --allow-same-version;
          npm ci --build-from-source          
          prebuild -t 20.0.0 --include-regex "\.(node|a|dll|so|dylib|pdb)$"
          prebuild -t 22.0.0 --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 24.0.0 --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 40.0.0 -r electron --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 42.0.0 -r electron --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 44.0.0 -r electron --include-regex "\.(node|a|dll|so|dylib)$"
          npm run build-testapp
          npm run mocha
          cd ..

      - name: build electron-blazor-glue
        run: |
          cd electron-blazor-glue
          npm ci
          npm run build-js-glue:release
          cd ..
      
      - uses: xresloader/upload-to-github-release@v1.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "coreclr-hosting/prebuilds/*"
          tags: true

      - name: build nuget packages
        run: |
          cd NodeHostEnvironment
          dotnet pack -c Release
          cd ../ElectronHostedBlazor
          dotnet pack -c Release
  
  build-linux:
    environment: deploy
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version:  | 
            8.0.x
            10.0.x

      - name: Show node version
        run: node --version
        
      - name: Show dotnet version
        run: dotnet --version
        
      - name: Install prebuild
        run: npm i -g prebuild
        
      - name: build & test coreclrhosting
        run: |
          cd coreclr-hosting
          npm version "${GITHUB_REF:11}" --allow-same-version
          npm ci --build-from-source
          prebuild -t 20.0.0 --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 22.0.0 --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 24.0.0 --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 40.0.0 -r electron --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 42.0.0 -r electron --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 44.0.0 -r electron --include-regex "\.(node|a|dll|so|dylib)$"    
          npm run build-testapp
          npm run mocha
          cd ..

      - name: build electron-blazor-glue
        run: |
          cd electron-blazor-glue
          npm version "${GITHUB_REF:11}" --allow-same-version
          npm ci
          npm run build-js-glue:release
          cd ..
      
      - uses: xresloader/upload-to-github-release@v1.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "coreclr-hosting/prebuilds/*"
          tags: true

      - name: deploy to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd coreclr-hosting
          echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > .npmrc
          echo "Publishing coreclr-hosting for tag ""${GITHUB_REF:11}"
          npm version "${GITHUB_REF:11}" --allow-same-version
          npm publish --access public --ignore-scripts
          cd ../electron-blazor-glue
          echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > .npmrc
          echo "Publishing electron-blazor-glue for tag ${GITHUB_REF:11}"
          sed -i 's!"coreclr-hosting": "file:../coreclr-hosting"!"coreclr-hosting": "'"${GITHUB_REF:11}"'"!g' package.json
          npm version "${GITHUB_REF:11}" --allow-same-version
          npm publish --access public --ignore-scripts

      - name: build nuget packages
        run: |
          cd NodeHostEnvironment
          dotnet pack -c Release
          cd ../ElectronHostedBlazor
          dotnet pack -c Release

      - name: publish nuget packages
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          cd NodeHostEnvironment/bin/Release
          dotnet nuget push NodeHostEnvironment."${GITHUB_REF:11}".nupkg -k "$NUGET_TOKEN" -s https://api.nuget.org/v3/index.json
          cd ../../../ElectronHostedBlazor/bin/Release
          dotnet nuget push ElectronHostedBlazor."${GITHUB_REF:11}".nupkg -k "$NUGET_TOKEN" -s https://api.nuget.org/v3/index.json
          cd ../../..

      - uses: xresloader/upload-to-github-release@v1.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "NodeHostEnvironment/bin/Release/*.snupkg;NodeHostEnvironment/bin/Release/*.nupkg;ElectronHostedBlazor/bin/Release/*.snupkg;ElectronHostedBlazor/bin/Release/*.nupkg"
          tags: true

  build-macos:
    # The type of runner that the job will run on
    runs-on: macos-latest
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version:  | 
            8.0.x
            10.0.x

      - name: Show node version
        run: node --version
        
      - name: Show dotnet version
        run: dotnet --version
        
      - name: Install prebuild
        run: npm i -g prebuild
        
      - name: build & test coreclrhosting
        run: |
          cd coreclr-hosting
          npm ci --build-from-source
          npm version "${GITHUB_REF:11}" --allow-same-version
          prebuild -t 20.0.0 --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 22.0.0 --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 24.0.0 --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 40.0.0 -r electron --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 42.0.0 -r electron --include-regex "\.(node|a|dll|so|dylib)$"
          prebuild -t 44.0.0 -r electron --include-regex "\.(node|a|dll|so|dylib)$"
          npm run build-testapp
          npm run mocha
          cd ..

      - name: build electron-blazor-glue
        run: |
          cd electron-blazor-glue
          npm ci
          npm run build-js-glue:release
          cd ..
      
      - uses: xresloader/upload-to-github-release@v1.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "coreclr-hosting/prebuilds/*"
          tags: true

      - name: build nuget packages
        run: |
          cd NodeHostEnvironment
          dotnet pack -c Release
          cd ../ElectronHostedBlazor
          dotnet pack -c Release


      
