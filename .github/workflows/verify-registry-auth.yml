# Verify registry auth without publishing anything.
#
# Manually trigger with: Actions -> "Verify registry auth" -> Run workflow.
# - npm: verifies the OIDC plumbing for npm Trusted Publishing (no NPM_TOKEN;
#   a full trust validation only happens at publish time via --provenance).
# - nuget: validates the NUGET_TOKEN (deploy environment) reaches nuget.org and
#   the secret is set.
# Safe to run at any time. This DOES NOT publish any package.
name: Verify registry auth

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to check (npm, nuget, all)'
        required: true
        default: 'all'

jobs:
  verify-npm:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'npm' }}
    runs-on: ubuntu-latest
    # npm now uses Trusted Publishing (OIDC) from the 'deploy' environment, so
    # there is no NPM_TOKEN. This job verifies the OIDC plumbing for that
    # environment (id-token: write + getting a token from GitHub). A real
    # trust validation only happens at publish time (npm publish --provenance).
    environment: deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify npm OIDC token (non-publishing)
        run: |
          # Request an OIDC token from GitHub for this workflow. If this fails,
          # the 'deploy' environment is not configured with id-token: write.
          TOKEN_JSON=$(curl -sS             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore")
          echo "OIDC token requested. Contains subject claim:"
          echo "$TOKEN_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);const v=JSON.parse(Buffer.from(j.value.split('.')[1],'base64').toString());console.log('  sub =',v.sub)}catch(e){console.log('  (could not parse claim; raw status: '+d.slice(0,120)+')')}})"
          echo "npm OIDC plumbing OK"

  verify-nuget:
    if: github.event.inputs.scope == 'all' || github.event.inputs.scope == 'nuget'
    runs-on: ubuntu-latest
    # NUGET_TOKEN is scoped to the 'deploy' environment (as in release.yml).
    environment: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify NuGet token (non-destructive)
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          # NuGet has no read-only "whoami". The definitive check is a push;
          # this step stays non-destructive and confirms the secret is set and
          # the registry is reachable. To do a full auth test, push a throwaway
          # `*-ci` package and delete it (see step 'Full NuGet auth test' below).
          if [ -z "${NUGET_TOKEN}" ]; then
            echo "NUGET_TOKEN secret is not set."
            exit 1
          fi
          echo "NUGET_TOKEN is set (length ${#NUGET_TOKEN})."
          dotnet nuget list source
          curl -sS -o /dev/null -w "nuget.org v3 index reachable: HTTP %{http_code}\n" \
            https://api.nuget.org/v3/index.json
          echo "Non-destructive NuGet check complete."

      # Definitive NuGet auth test (throwaway package: push then delete).
      # Uncomment to actually push a package to nuget.org and delete it again,
      # which is the only way to truly validate the API key end-to-end.
      # - name: Full NuGet auth test (push + delete)
      #   env:
      #     NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
      #   run: |
      #     cd NodeHostEnvironment
      #     dotnet pack -c Release -p:Version=0.0.0-ci -p:PackageVersion=0.0.0-ci -o /tmp/ci
      #     dotnet nuget push /tmp/ci/NodeHostEnvironment.0.0.0-ci.nupkg \
      #       -k "${NUGET_TOKEN}" -s https://api.nuget.org/v3/index.json \
      #       --skip-duplicate
      #     dotnet nuget delete NodeHostEnvironment 0.0.0-ci \
      #       -k "${NUGET_TOKEN}" -s https://api.nuget.org/v3/index.json || echo "delete may need web/manual (private packages)"